name: fieldops

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "FieldOps_Dev_2024"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Ejecuta todos los scripts de backend/db/*.sql en orden alfabetico y termina.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "FieldOps_Dev_2024"
    volumes:
      - ./backend/db:/db:ro
    entrypoint: ["/bin/bash", "/db/init.sh"]

  api:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FieldOps: "Server=sqlserver,1433;Database=FieldOps;User Id=sa;Password=FieldOps_Dev_2024;TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY en el archivo .env}
    ports:
      - "5080:5080"

volumes:
  sqlserver-data:
